- key: table:email_webhook_inbox;slot:help
  summary: 'A provider notification received for later processing into email delivery events.'
  content: |
    **How rows get created:** Verified provider callbacks create inbox rows for background processing. Configure your provider's notification destination to receive delivery updates.

    Use **Webhook Inbox** on a provider to investigate delivery notifications. A row keeps the received payload, its external identifier, processing state and any retry error. Processing can create **Events** and update the related **Message** or **Suppression**.

    These rows are service-written. If processing failed, investigate the error before using **Reprocess**. The inbox tracks notification processing separately from sending attempts, so a failed inbox row does not necessarily mean the original email failed to send.
- key: table:email_webhook_inbox;field:providerId
  summary: 'The provider that sent this notification.'
- key: table:email_webhook_inbox;field:kind
  summary: 'The provider notification format recorded for this payload.'
- key: table:email_webhook_inbox;field:externalEventId
  summary: 'The provider’s event identifier used to recognize repeat notifications.'
- key: table:email_webhook_inbox;field:nonce
  summary: 'A notification reference used to detect replayed requests.'
  content: |
    The notification reference helps the receiver recognize replayed requests. It is recorded alongside the provider and external event identifier so repeated notifications can be handled safely. Use the inbox status, payload checksum and error when investigating duplicate or failed notifications. This value identifies notification processing; it is not a sender credential or proof of email delivery.
- key: table:email_webhook_inbox;field:status
  summary: 'The notification’s current processing state.'
- key: table:email_webhook_inbox;field:attempts
  summary: 'The number of processing attempts recorded for this notification.'
- key: table:email_webhook_inbox;field:nextAttemptDate
  summary: 'When this notification is next eligible for processing.'
- key: table:email_webhook_inbox;field:lastError
  summary: 'The latest error encountered while processing the notification.'
- key: table:email_webhook_inbox;field:payloadJson
  summary: 'The received notification content stored for processing.'
- key: table:email_webhook_inbox;field:payloadSha256
  summary: 'A checksum of the received notification content.'
- key: table:email_webhook_inbox;field:receivedDate
  summary: 'When the notification was received.'
- key: table:email_webhook_inbox;field:processedDate
  summary: 'When processing of the notification completed.'
- key: table:email_event;slot:help
  summary: 'A delivery, bounce, complaint or engagement event reported for an outgoing message.'
  content: |
    **How rows get created:** Notification processing records events reported by your provider. You do not enter them manually; an empty list can mean no callbacks have arrived.

    Open **Events** from a message to see what its provider reported after sending. Events can record delivery, bounces, complaints and engagement, together with the recipient, occurrence time and available detail. Availability depends on the provider and tracking configuration.

    Events are written by notification processing, not entered manually. Compare them with **Attempts** when diagnosing mail: attempts describe handing mail to a provider, while events describe what the provider reported afterward.
- key: table:email_event;field:messageId
  summary: 'The outgoing message this event describes.'
- key: table:email_event;field:providerId
  summary: 'The provider that reported this event.'
- key: table:email_event;field:eventType
  summary: 'The kind of delivery or engagement event reported.'
- key: table:email_event;field:bounceType
  summary: 'The provider’s classification of the bounce.'
- key: table:email_event;field:recipient
  summary: 'The recipient affected by this event.'
- key: table:email_event;field:occurredDate
  summary: 'When the event occurred according to the recorded notification.'
- key: table:email_event;field:detail
  summary: 'Additional information recorded for the event.'
- key: table:email_event;field:url
  summary: 'The link associated with this event, when reported.'
- key: process:email_resend;slot:help
  summary: 'Queue another message using an eligible message’s saved content.'
  content: |
    Use **Resend** after reviewing a failed or returned message and correcting its underlying problem. The action creates another send through the outbox using the saved message information; it does not rewrite the original delivery history. Review the selected messages first. Suppression, provider and content checks still apply, so resending is not a guarantee that mail will be accepted or delivered.
- key: process:email_cancel;slot:help
  summary: 'Cancel an eligible outgoing message before the dispatcher sends it.'
  content: |
    Use **Cancel** when a queued message should no longer be sent. Review the selected messages before continuing. The action checks their current state again and cancels only messages still eligible for cancellation. It cannot recall mail already handed to a provider. Check **Messages** and **Attempts** afterward if a selected message was skipped or had already been claimed.
- key: process:email_send_now;slot:help
  summary: 'Attempt to send an eligible queued message without waiting for normal dispatch.'
  content: |
    Use **Send Now** when you want the dispatcher to attempt an eligible message immediately. Review the selected messages before continuing. The send still goes through the outbox dispatcher and its provider, suppression and delivery controls. Open **Attempts** afterward to inspect the result. A successful handoff to a provider is separate from a later delivery notification.
- key: process:email_send_test;slot:help
  summary: 'Send a test email through the selected enabled provider.'
  content: |
    Use **Send Test Email** to check a provider’s configuration with a recipient you control. Enter **To address** and optionally select one of that provider’s sender addresses. The test is queued through the normal email service and then attempted immediately. Review the result and the resulting **Message** or **Attempts** if the provider refuses the send or delivery does not arrive.
- key: process:email_send_templated;slot:help
  summary: 'Prepare and queue an email using a template and supplied variables.'
  content: |
    Use **Send Email** when an application needs to send reusable template content. The service resolves the template version, variables, sender and delivery provider, then records the prepared message in **Messages**. Queuing and delivery are separate steps. Inspect the returned result and message state rather than assuming that accepting the request means the recipient has received the email.
- key: process:email_send_ad_hoc;slot:help
  summary: 'Prepare and queue an email from supplied subject and body content.'
  content: |
    Use **Send Ad Hoc Email** for content supplied directly instead of through a reusable template. The request still passes through the email service and durable outbox, including recipient, provider and suppression checks. Inspect the result in **Messages** and its **Attempts**. A queued result means the request was stored for sending, not that delivery has already succeeded.
- key: process:email_new_version;slot:help
  summary: 'Create a new editable draft version of the selected email template.'
  content: |
    Use **New Version** when you need to change a template without editing the active version. Review the selected template, then continue to create a draft. Open its **Versions** to edit the content and sample variables. Check **Preview** before using **Activate Version**. Creating a draft alone does not select it for normal outgoing messages or approve it for protected health information.
- key: process:email_activate_version;slot:help
  summary: 'Make a reviewed draft the active version of its email template.'
  content: |
    Use **Activate Version** after checking the draft’s subject, body and sample preview. Review the selected version before continuing. Activation changes the version used for subsequent template sends; it does not regenerate messages already in the outbox. Approval for protected health information is a separate decision. Open the parent **Template** afterward to check its active and approved version references.
- key: process:email_approve_phi;slot:help
  summary: 'Record approval of a template version for protected health information.'
  content: |
    Use **Approve For PHI** only after reviewing the selected version and its variable declarations for the intended protected health information. This is an email administrator action and records approval for a specific version. Approval does not make every provider suitable for sensitive delivery. Check the parent **Template** and the chosen **Provider** when investigating why a protected message was refused.
- key: process:email_reprocess_webhook;slot:help
  summary: 'Return a failed provider notification to the processing queue.'
  content: |
    Use **Reprocess** from **Webhook Inbox** after investigating a failed notification. Review the selected records and correct the cause before retrying. Eligible failed rows return to pending processing; the inbox processor later turns them into delivery events and related updates. This action retries notification handling, not the original email send. Check the inbox status and error after processing runs again.
- key: process:email_process_webhooks;slot:help
  summary: 'Process due provider notifications into email events and delivery updates.'
  content: |
    This background action processes notifications waiting in **Webhook Inbox**. Use its results when investigating why a provider’s notification has not appeared under a message’s **Events**. Processing can update delivery state and suppressions as appropriate. Failed notifications retain diagnostic and retry information. Review that information before using **Reprocess** on a failed inbox record.
- key: process:email_dispatch;slot:help
  summary: 'Attempt delivery of outgoing messages that are due for sending.'
  content: |
    The dispatcher claims eligible messages from the outbox and attempts delivery through their providers. Use **Messages** and **Attempts** to inspect what happened, including provider errors and scheduled retries. Dispatch honors the service’s delivery controls and records each attempt. A completed send attempt can still be followed by a delivery, bounce or complaint event reported by the provider.
- key: process:email_maintain;slot:help
  summary: 'Maintain the outgoing email queue and recover expired delivery claims.'
  content: |
    This background action performs the dispatcher’s queue maintenance. Use it when investigating messages whose worker claim expired or whose delivery state needs maintenance before another attempt. Review **Messages** and **Attempts** for the resulting state and error details. Maintenance is separate from processing provider notifications, which are handled through **Webhook Inbox**, and from clearing old retained message content.
- key: process:email_retention;slot:help
  summary: 'Clear expired email content and remove old delivery detail according to retention settings.'
  content: |
    Retention limits how long detailed email content remains stored. This action clears old bodies and saved variable values. Notification and marketing message records remain so their unsubscribe links keep working; other completed messages and their attempts and events can be deleted when message retention expires. Use **Messages** to inspect retained history. Missing old content can reflect retention rather than a sending failure.
