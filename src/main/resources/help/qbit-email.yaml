- key: table:email_message;field:rfcMessageId
  summary: The stable Message-ID used in the outgoing email headers.
  content: |
    Generated when the message is queued and reused on delivery attempts. This identifies the message independently of **{{label:email_message.providerMessageId}}**.
- key: process:email_provider.bulkInsert;slot:help
  summary: Import new records from a file after mapping columns and reviewing validation.
  content: |
    Use **{{label:email_provider.bulkInsert}}** on **{{label:email_provider}}**. Map your file columns to the fields you want to create, then review validation messages before continuing. Check the resulting records afterward. Email permissions and validation still apply.
- key: process:email_provider.bulkEdit;slot:help
  summary: Update selected records with shared field values after reviewing the selection.
  content: |
    Use **{{label:email_provider.bulkEdit}}** on **{{label:email_provider}}**. Choose the fields and values to apply to your selection, then review the proposed changes before continuing. Email permissions and validation still apply; review any skipped or rejected records.
- key: process:email_provider.bulkEditWithFile;slot:help
  summary: Update existing records by matching them to rows in a file.
  content: |
    Use **{{label:email_provider.bulkEditWithFile}}** on **{{label:email_provider}}**. Map your file columns and check how rows match existing records. Review the proposed updates before continuing and check the result for rejected rows. Email permissions and validation still apply.
- key: process:email_provider.bulkDelete;slot:help
  summary: Delete selected records after reviewing the selection and its dependencies.
  content: |
    Use **{{label:email_provider.bulkDelete}}** on **{{label:email_provider}}**. Review your selection carefully before continuing. Records still needed by other email records may be refused. Check the result for records that could not be removed. Deletion does not recall messages already sent.
